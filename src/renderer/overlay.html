<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臭臭监督官上线</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body>
  <main class="overlay">
    <div class="message">
      <p id="eyebrow">臭臭监督官上线</p>
      <h1 id="headline">休息一下吧</h1>
      <div id="countdown">05:00</div>
      <p id="hint">看看远处，放松眼睛和肩膀</p>
      <button id="end-break" disabled>30 秒后可以提前结束</button>
    </div>
    <div class="cat-stage">
      <div class="cat-shadow"></div>
      <img src="../../assets/cat/chouchou.png" alt="Chouchou" class="cat">
    </div>
  </main>
  <script src="overlay.js"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>臭臭监督官</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <div>
        <p class="eyebrow" data-i18n="eyebrow">休息提醒助手</p>
        <h1 data-i18n="title">臭臭监督官</h1>
        <p class="subtitle" data-i18n="subtitle">专注工作，也要记得看看远处。</p>
      </div>
      <img src="../../assets/cat/chouchou.png" alt="Chouchou" class="hero-cat">
    </header>

    <section class="status-card">
      <span class="status-dot"></span>
      <div>
        <strong id="status-title">监督中</strong>
        <p id="status-detail">距离下次休息还有 45:00</p>
      </div>
      <button id="preview" class="button secondary" data-i18n="preview">立即预览</button>
    </section>

    <form id="settings-form">
      <section class="card">
        <h2 data-i18n="schedule">时间安排</h2>
        <div class="field-grid">
          <label>
            <span data-i18n="focusDuration">专注时长</span>
            <span class="number-control"><input id="focus-minutes" type="number" min="1" max="180" required><em data-i18n="minutes">分钟</em></span>
          </label>
          <label>
            <span data-i18n="breakDuration">休息时长</span>
            <span class="number-control"><input id="break-minutes" type="number" min="1" max="30" required><em data-i18n="minutes">分钟</em></span>
          </label>
        </div>
        <div class="quick-row">
          <button type="button" data-focus="25" data-break="5">25 / 5</button>
          <button type="button" data-focus="45" data-break="5">45 / 5</button>
          <button type="button" data-focus="60" data-break="10">60 / 10</button>
        </div>
      </section>

      <section class="card">
        <h2 data-i18n="preferences">偏好设置</h2>
        <label class="row">
          <span><strong data-i18n="language">界面语言</strong><small data-i18n="languageHint">默认跟随系统</small></span>
          <select id="language">
            <option value="system">跟随系统 / System</option>
            <option value="zh-CN">简体中文</option>
            <option value="en">English</option>
          </select>
        </label>
        <label class="row">
          <span><strong data-i18n="closeMode">提醒关闭方式</strong><small data-i18n="closeModeHint">选择提醒出现后是否需要等待 30 秒</small></span>
          <select id="close-mode">
            <option value="immediate" data-i18n="closeImmediate">立即关闭</option>
            <option value="after30" data-i18n="closeAfter30">30 秒后关闭</option>
          </select>
        </label>
        <label class="row">
          <span><strong data-i18n="launch">开机自动启动</strong><small data-i18n="launchHint">默认关闭，可随时更改</small></span>
          <input id="launch-at-login" class="switch" type="checkbox">
        </label>
        <label class="row">
          <span><strong data-i18n="updates">检查新版本</strong><small data-i18n="updatesHint">每天最多检查一次，只提示下载</small></span>
          <input id="update-checks" class="switch" type="checkbox">
        </label>
      </section>

      <div class="actions">
        <span id="save-message"></span>
        <button type="submit" class="button primary" data-i18n="save">保存设置</button>
      </div>
    </form>
  </main>
  <script src="settings.js"></script>
</body>
</html>

name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build installer
        run: pnpm dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: chouchou-supervisor-windows
          path: |
            dist/Chouchou-Supervisor-Setup-*.exe
            dist/Chouchou-Supervisor-Setup-*.exe.blockmap

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem dist -File | Where-Object Name -Like "Chouchou-Supervisor-Setup-*"
          gh release create $env:GITHUB_REF_NAME $assets.FullName --verify-tag --generate-notes
